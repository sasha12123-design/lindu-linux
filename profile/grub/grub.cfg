set timeout=15

loadfont unicode

set gfxmode=1024x768
set gfxpayload=keep
load_video

insmod gfxterm

set locale_dir=$prefix/locale
set lang=en_US
insmod gettext

terminal_input console
terminal_output gfxterm

set editor=false

menuentry "lindu linux (x86_64, UEFI)" {
    set gfxpayload=keep
    search --no-floppy --set=root --label LINDU_LABEL
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archiso_iso_sfx=.iso archiso_loop_sfx=.iso archiso_pxe_sfx=.iso copytoram=n
    initrd /arch/boot/x86_64/initramfs-linux.img
}

menuentry "lindu linux (x86_64, UEFI) - copy to RAM" {
    set gfxpayload=keep
    search --no-floppy --set=root --label LINDU_LABEL
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archiso_iso_sfx=.iso archiso_loop_sfx=.iso archiso_pxe_sfx=.iso copytoram=y
    initrd /arch/boot/x86_64/initramfs-linux.img
}

menuentry "lindu linux (x86_64, UEFI) - fallback initramfs" {
    set gfxpayload=keep
    search --no-floppy --set=root --label LINDU_LABEL
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archiso_iso_sfx=.iso archiso_loop_sfx=.iso archiso_pxe_sfx=.iso copytoram=n
    initrd /arch/boot/x86_64/initramfs-linux-fallback.img
}