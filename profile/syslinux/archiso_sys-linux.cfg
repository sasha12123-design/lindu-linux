CONSOLE 0
SERIAL 0 9600 0
DEFAULT boot
PROMPT 0
TIMEOUT 15
ONTIMEOUT boot

LABEL boot
TEXT HELP
Загрузка установочного носителя lindu linux (BIOS).
ENDTEXT
MENU LABEL lindu linux install medium (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%