name: build-iso

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ISO (Docker / Arch Linux)
        run: |
          bash build/build-in-docker.linux.sh

      - name: List artifacts
        run: |
          ls -lh out/*.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: lindu-iso
          path: out/*.iso
          if-no-files-found: error
          retention-days: 14

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.iso
          generate_release_notes: true