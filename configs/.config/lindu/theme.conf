# оформление рабочего стола lindu linux
# этот файл меняет программа настроек (шестерёнка на панели)
# значения применяются сразу, перезапускать менеджер не нужно

name = dark
bar = #1b2340
text = #e8ecf8
act = #2f3f75
line = #7fd4f0

# высота панели в пикселях
barh = 34
# показывать панель: 1 = да, 0 = нет
showbar = 1
# часы: 0 = только время, 1 = время и дата, 2 = с секундами
clock = 1
# высота верхней полосы окна, за которую его можно таскать мышью, px
dragtop = 84
# ширина главного окна в плитке, %
master = 55
